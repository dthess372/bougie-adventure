# Monthly cadence on purpose: every Dependabot PR triggers a Vercel preview
# deployment and a review, so this bounds both. Security updates still arrive
# as soon as an alert opens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
